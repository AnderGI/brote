plugins {
    id 'java'
    id 'java-test-fixtures'
}


java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

dependencies {
    implementation 'org.springframework:spring-context:7.0.6'
    // Replace JavaFaker with DataFaker
    testFixturesImplementation("net.datafaker:datafaker:2.4.0")
}

sourceSets {
    main {
        java { srcDirs = ['main'] }
        resources { srcDirs = ['main/resources'] }
    }

    test {
        java { srcDirs = ['test'] }
        resources { srcDirs = ['test/resources'] }
    }

    testFixtures {
        java { srcDirs = ['testFixtures'] }
        resources { srcDirs = ['testFixtures/resources'] }
    }

}


jar {
    enabled = true
}

println('BACKOFFICE FILE: This is executed during the initialization phase')