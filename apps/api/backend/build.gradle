plugins {
    id 'java'
    id 'org.springframework.boot' version '4.0.5'
    id 'io.spring.dependency-management' version '1.1.7'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

dependencies {
    implementation(project(":backoffice"))

    implementation 'org.springframework.boot:spring-boot-starter'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'com.bucket4j:bucket4j_jdk17-lettuce:8.19.0'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

}


tasks.named('test') {
    useJUnitPlatform()
}

sourceSets {
    main {
        java { srcDirs = ['main'] }
        resources { srcDirs = ['main/resources'] }
    }
    test {
        java { srcDirs = ['test'] }
        resources { srcDirs = ['test/resources'] }
    }
}

springBoot {
    mainClass = 'com.andergi.brote.api.backend.ApiBackendApp'
}

bootJar {
    enabled = true
    archiveBaseName.set('brote-api')
    archiveVersion.set('0.0.1')
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

jar {
    enabled = false
}


println('APPS-BACKOFFICE FILE: This is executed during the initialization phase')